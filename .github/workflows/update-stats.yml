name: Update Stats Cards

on:
  schedule:
    # Runs nightly at 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The generator lives inline here (not as a committed .py file) so the
      # repository only ever contains the 9 files listed in the project spec.
      - name: Regenerate assets/stats.svg and assets/languages.svg
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          USERNAME = os.environ["GH_USERNAME"]
          TOKEN = os.environ.get("GITHUB_TOKEN", "")
          API = "https://api.github.com"
          HEADERS = {"Accept": "application/vnd.github+json", "User-Agent": USERNAME}
          if TOKEN:
              HEADERS["Authorization"] = f"Bearer {TOKEN}"

          def get_json(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read().decode())

          user = get_json(f"{API}/users/{USERNAME}")
          repos = get_json(f"{API}/users/{USERNAME}/repos?per_page=100&type=owner")

          joined = user.get("created_at", "")[:7]
          if joined:
              y, m = joined.split("-")
              months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
              joined = f"{months[int(m) - 1]} {y}"

          lang_bytes = {}
          for repo in repos:
              if repo.get("fork"):
                  continue
              try:
                  langs = get_json(repo["languages_url"])
              except Exception:
                  langs = {}
              for lang, count in langs.items():
                  lang_bytes[lang] = lang_bytes.get(lang, 0) + count

          data = {
              "public_repos": user.get("public_repos", 0),
              "followers": user.get("followers", 0),
              "following": user.get("following", 0),
              "joined": joined or "—",
          }

          def stat_row(y, icon_color, label, value, delay):
              return f'''
            <g transform="translate(36,{y})" opacity="0">
              <animate attributeName="opacity" from="0" to="1" begin="{delay}s" dur="0.6s" fill="freeze"/>
              <circle cx="7" cy="0" r="4" fill="{icon_color}"/>
              <text x="22" y="4.5" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8B949E">{label}</text>
              <text x="404" y="4.5" text-anchor="end" font-family="'JetBrains Mono',Consolas,monospace" font-size="16" font-weight="700" fill="#F0F6FC">{value}</text>
            </g>'''

          rows = "".join([
              stat_row(84, "#58A6FF", "Public Repositories", data["public_repos"], 0.1),
              stat_row(120, "#7EE787", "Followers", data["followers"], 0.25),
              stat_row(156, "#F1E05A", "Following", data["following"], 0.4),
              stat_row(192, "#D2A8FF", "Building since", data["joined"], 0.55),
          ])

          stats_svg = f'''<svg width="480" height="270" viewBox="0 0 480 270" role="img" aria-labelledby="statsTitle statsDesc" xmlns="http://www.w3.org/2000/svg">
            <title id="statsTitle">GitHub overview for {USERNAME}</title>
            <desc id="statsDesc">Public repositories: {data["public_repos"]}. Followers: {data["followers"]}. Following: {data["following"]}. Building since {data["joined"]}.</desc>
            <defs>
              <linearGradient id="statsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#58A6FF"/><stop offset="100%" stop-color="#7EE787"/>
              </linearGradient>
              <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#161B22"/><stop offset="100%" stop-color="#0D1117"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="476" height="266" rx="18" fill="url(#statsBg)" stroke="#30363D" stroke-width="1"/>
            <rect x="2" y="2" width="476" height="266" rx="18" fill="none" stroke="url(#statsBorder)" stroke-width="1.4" opacity="0.5">
              <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
            </rect>
            <text x="36" y="42" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F0F6FC">GitHub Overview</text>
            <text x="444" y="42" text-anchor="end" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#484F58">@{USERNAME}</text>
            <line x1="36" y1="54" x2="444" y2="54" stroke="#21262D" stroke-width="1"/>
            {rows}
            <line x1="36" y1="216" x2="444" y2="216" stroke="#21262D" stroke-width="1"/>
            <g opacity="0">
              <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.7s" fill="freeze"/>
              <circle cx="43" cy="240" r="4" fill="#7EE787">
                <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
              </circle>
              <text x="56" y="244.5" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8B949E">Auto-refreshed nightly from the GitHub API</text>
            </g>
          </svg>
          '''
          with open("assets/stats.svg", "w") as f:
              f.write(stats_svg)

          LANG_COLORS = {"Python":"#3572A5","JavaScript":"#F1E05A","HTML":"#E34C26","CSS":"#563D7C",
                         "TypeScript":"#3178C6","Jupyter Notebook":"#DA5B0B","Shell":"#89E051",
                         "Java":"#B07219","SCSS":"#C6538C"}
          FALLBACK = [("Programming Languages",5,"#58A6FF"),("AI / Machine Learning",7,"#7EE787"),
                      ("Web Development",6,"#F1E05A"),("Database Management",6,"#D2A8FF"),
                      ("Developer Tools",6,"#FFA657"),("Core CS Concepts",5,"#FF7B72")]

          def bar_row(y, label, pct, color, delay, max_w=300):
              w = round(pct / 100 * max_w)
              return f'''
            <g transform="translate(36,{y})">
              <text x="0" y="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#C9D1D9">{label}</text>
              <rect x="0" y="10" width="{max_w}" height="8" rx="4" fill="#21262D"/>
              <rect x="0" y="10" width="0" height="8" rx="4" fill="{color}">
                <animate attributeName="width" from="0" to="{w}" begin="{delay}s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.6 0.3 1"/>
              </rect>
            </g>'''

          rows2, y2, delay2 = "", 78, 0.15
          if lang_bytes:
              total = sum(lang_bytes.values())
              top = sorted(lang_bytes.items(), key=lambda kv: kv[1], reverse=True)[:6]
              for lang, count in top:
                  pct = count / total * 100
                  color = LANG_COLORS.get(lang, "#8B949E")
                  rows2 += bar_row(y2, f"{lang} — {pct:.1f}%", pct, color, round(delay2, 2))
                  y2 += 34; delay2 += 0.15
              title2 = "Most Used Languages"
          else:
              maxv = max(c[1] for c in FALLBACK)
              for label, value, color in FALLBACK:
                  pct = value / maxv * 100
                  rows2 += bar_row(y2, label, pct, color, round(delay2, 2))
                  y2 += 34; delay2 += 0.15
              title2 = "Core Tech Stack"

          height2 = y2 + 18
          lang_svg = f'''<svg width="480" height="{height2}" viewBox="0 0 480 {height2}" role="img" aria-labelledby="langTitle langDesc" xmlns="http://www.w3.org/2000/svg">
            <title id="langTitle">Core tech stack for {USERNAME}</title>
            <desc id="langDesc">{title2}, auto-refreshed from the GitHub API.</desc>
            <defs>
              <linearGradient id="langBorder" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#58A6FF"/><stop offset="100%" stop-color="#7EE787"/>
              </linearGradient>
              <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#161B22"/><stop offset="100%" stop-color="#0D1117"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="476" height="{height2 - 4}" rx="18" fill="url(#langBg)" stroke="#30363D" stroke-width="1"/>
            <rect x="2" y="2" width="476" height="{height2 - 4}" rx="18" fill="none" stroke="url(#langBorder)" stroke-width="1.4" opacity="0.5">
              <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
            </rect>
            <text x="36" y="42" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#F0F6FC">{title2}</text>
            <line x1="36" y1="54" x2="444" y2="54" stroke="#21262D" stroke-width="1"/>
            {rows2}
          </svg>
          '''
          with open("assets/languages.svg", "w") as f:
              f.write(lang_svg)

          print("Updated assets/stats.svg and assets/languages.svg for", USERNAME)
          PYEOF

      - name: Commit changes if anything updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg
          git diff --cached --quiet || git commit -m "chore: refresh stats cards [skip ci]"
          git push
